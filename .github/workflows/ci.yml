name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          python -m ruff check .

      - name: Run Tests
        run: |
          python -m pytest -v

      - name: Validate Project Structure
        run: |
          test -f src/app.py
          test -f src/graph/workflow.py
          test -f src/graph/nodes.py
          test -f requirements.txt